<div class="full-view-container">
  <header class="header">
    <img src="assets/icons/xilonen-logo.png" alt="xilonen-logo">
    <div class="header-actions">
      <i class="fas fa-bell notification-icon" (click)="toggleNotifications($event)"></i>
      <div class="notifications-dropdown" *ngIf="showNotifications" (click)="$event.stopPropagation()">
        <div class="notifications-header">
          <h3>Notificaciones</h3>
        </div>
        <div class="notifications-list">
          <div class="notification-item" *ngFor="let notification of notifications">
            <div class="notification-content">
              <span class="notification-title">{{ notification.title }}</span>
              <span class="notification-time">{{ notification.time }}</span>
            </div>
          </div>
          <div class="no-notifications" *ngIf="notifications.length === 0">
            No hay notificaciones
          </div>
        </div>
      </div>
    </div>
  </header>
  
  <div class="content-wrapper">
    <div class="vertical-menu">
      <a routerLink="/home" class="menu-item" title="Inicio" routerLinkActive="active">
        <img src="assets/icons/home.png" class="icons" alt="Home-Icon">
        <span class="menu-label">Inicio</span>
      </a>
      <a routerLink="/report" class="menu-item" title="Reportes" routerLinkActive="active">
        <img src="assets/icons/report.png" class="icons" alt="Report-Icon">
        <span class="menu-label">Reportes</span>
      </a>
      <a routerLink="/help" class="menu-item" title="Ayuda" routerLinkActive="active">
        <img src="assets/icons/question.png" class="icons" alt="Help-Icon">
        <span class="menu-label">Ayuda</span>
      </a>
    </div>
    <main class="main-content">
      <ng-content></ng-content>
    </main>
  </div>
</div>
