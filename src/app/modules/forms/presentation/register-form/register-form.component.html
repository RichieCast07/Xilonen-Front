<div class="registration-container">
  <div class="left-section">
    <div class="image-container">
      <img src="assets/images/images.png" alt="Decorative background" class="auth-image">
      <div class="image-overlay">
        <h2>Bienvenido a Xilonen</h2>
        <p>Únete a nuestra comunidad y potencia tus ganancias.</p>
      </div>
    </div>
  </div>

  <div class="right-section">
    <form class="register-form" (ngSubmit)="onRegisterClick()">
      <div class="welcome-text">Bienvenido</div>
      <h1 class="title">Crea tu cuenta</h1>
      
      <div class="form-group">
        <label for="name">Nombre Completo</label>
        <input type="text" id="name" placeholder="Introduce tu nombre completo">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="tu.email@ejemplo.com">
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Crea una contraseña segura">
        <div class="password-hint">Utilice más de 8 caracteres con una combinación de letras, números y símbolos.</div>
      </div>
      
      <div class="form-footer">
        <button type="submit" class="btn-signup">Registrar</button>
        
        <div class="login-link">
          Ya tiene una cuenta? <a (click)="onLoginClick()">Iniciar Sesion</a>
        </div>
      </div>
    </form>
  </div>
</div>
